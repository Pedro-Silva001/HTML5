<!DOCTYPE html>
<html lang="pt-BR">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>CADASTRO DE LIVROS</title>

</head>
<body>

    <header>
        
        <h1>CADASTRO DE REFERÊNCIA BIBLIOGRÁFICA</h1>
        <p>Cadastre os livros recomendados para as disciplinas.</p>
    
    </header>

    <main>
        <section>
            <form action="/salvar-livro" method="post">

                <fieldset>
                    
                    <legend>Informações da Obra</legend>

                    <p>
                        
                        <label for="titulo">Título do Livro:</label>
                        <input type="text" id="titulo" name="titulo" required>
                    
                    </p>

                    <p>
                        
                        <label for="autores">Autor(es):</label>
                        <input type="text" id="autores" name="autores" required>
                    
                    </p>

                    <p>
                        
                        <label for="isbn">ISBN (13 dígitos):</label>
                        <input type="text" id="isbn" name="isbn"
                            placeholder="Digite os 13 números"
                            inputmode="numeric"
                            pattern="[0-9]{13}"
                            minlength="13"
                            maxlength="13"
                            title="O ISBN deve conter exatamente 13 dígitos numéricos"
                            required>
                    
                    </p>

                    <p>
                        
                        <label for="ano">Ano de Publicação:</label>
                        <input type="number" id="ano" name="ano"
                            placeholder="Ex: 2023"
                            min="1500" max="2026"
                            required>
                    
                    </p>
                
                </fieldset>

                <fieldset>
                    
                    <legend>Detalhes Acadêmicos</legend>

                    <p>
                        
                        <label for="curso">Curso Alvo:</label>
                        
                        <select id="curso" name="curso" required>
                            <option value="" disabled selected>Selecione o curso...</option>
                            <option value="engenharia-software">Engenharia de Software</option>
                            <option value="ads">Análise e Desenv. de Sistemas</option>
                            <option value="tronco-comum">Tronco Comum</option>
                        </select>
                    
                    </p>

                    <p>
                        
                        <label for="disciplina">Disciplina:</label>
                        <input type="text" id="disciplina" name="disciplina" required>
                    
                    </p>

                    <p>Formato do Material:</p>
                    <p>
                        
                        <input type="radio" id="formato-fisico" name="formato" value="fisico" required>
                        <label for="formato-fisico">Físico</label>

                        <input type="radio" id="formato-digital" name="formato" value="digital" required>
                        <label for="formato-digital">Digital</label>

                        <input type="radio" id="formato-ambos" name="formato" value="ambos" required>
                        <label for="formato-ambos">Ambos</label>
                    
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Salvar Livro</button>
                </p>

            </form>
        </section>
    </main>

</body>
</html>
